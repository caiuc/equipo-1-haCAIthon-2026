<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <title>Mapa Santiago Optimizado</title>
    <style>
        body, html { margin:0; padding:0; height:100%; width:100%; }
        #map { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from "https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs";

        const map = new maplibregl.Map({
            container: "map",
            style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
            center: [-70.6483, -33.4569], // Santiago
            zoom: 12,
            maxBounds: [
                [-70.85, -33.65], // suroeste
                [-70.45, -33.35]  // noreste
            ]
        });

        // Cargar datos como GeoJSON
        fetch("paraderos_accesibilidad.json")
            .then(r => r.json())
            .then(data => {
                const geojson = {
                    type: "FeatureCollection",
                    features: data.map(p => ({
                        type: "Feature",
                        geometry: {
                            type: "Point",
                            coordinates: [p.lon, p.lat]
                        },
                        properties: {
                            name: p.name,
                            stop_id: p.stop_id,
                            es_metro: p.es_metro === true || p.es_metro === "true" || p.es_metro === "Sí",
                            wheelchair_boarding: p.wheelchair_boarding,
                            reportes: p.reportes || []
                        }
                    }))
                };

                map.on("load", () => {
                    map.addSource("paradas", { type: "geojson", data: geojson });

                    map.addLayer({
                        id: "paradas-layer",
                        type: "circle",
                        source: "paradas",
                        paint: {
                            "circle-radius": 5,
                            "circle-color": [
                                "case",
                                ["==", ["get", "es_metro"], true], "#ff0000", // rojo si es metro
                                "#007cbf" // azul si no lo es
                            ]
                        }
                    });

                    // Popup al hacer click
                    map.on("click", "paradas-layer", e => {
                        const p = e.features[0].properties;
                        const popupContent = `
                            <strong>${p.name}</strong><br>
                            ID: ${p.stop_id}<br>
                            Metro: ${p.es_metro ? "Sí" : "No"}<br>
                            Accesibilidad: ${p.wheelchair_boarding}<br>
                            Reportes: ${p.reportes.length > 0 ? p.reportes : "Ninguno"}
                        `;
                        new maplibregl.Popup()
                            .setLngLat(e.features[0].geometry.coordinates)
                            .setHTML(popupContent)
                            .addTo(map);
                    });

                    // Mostrar solo con zoom suficiente
                    map.setLayoutProperty("paradas-layer", "visibility", "none");
                    map.on("zoomend", () => {
                        map.setLayoutProperty(
                            "paradas-layer",
                            "visibility",
                            map.getZoom() >= 15 ? "visible" : "none"
                        );
                    });
                });
            })
            .catch(err => console.error("Error cargando JSON:", err));

        // 🚩 Geolocalización del usuario
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lng = pos.coords.longitude;
                    const lat = pos.coords.latitude;

                    // Centrar el mapa en la ubicación
                    map.setCenter([lng, lat]);
                    map.setZoom(15);

                    // Añadir marcador en la ubicación
                    new maplibregl.Marker({ color: "green" })
                        .setLngLat([lng, lat])
                        .setPopup(new maplibregl.Popup().setText("Tu ubicación"))
                        .addTo(map);
                },
                err => {
                    console.error("Error obteniendo ubicación:", err);
                    alert("No se pudo obtener tu ubicación");
                }
            );
        } else {
            alert("Tu navegador no soporta geolocalización");
        }
    </script>
</body>
</html>
