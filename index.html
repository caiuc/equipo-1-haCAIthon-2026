<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <title>Mapa Santiago con Paraderos</title>
    <style>
        body, html { margin:0; padding:0; height:100%; width:100%; }
        #map { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from "https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs";

        const map = new maplibregl.Map({
            container: "map",
            style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
            center: [-70.6483, -33.4569], // Santiago
            zoom: 12,
            maxBounds: [
                [-70.85, -33.65], // suroeste
                [-70.45, -33.35]  // noreste
            ]
        });

        let paradas = [];
        let markers = [];

        // Cargar el archivo JSON externo
        fetch("paraderos_accesibilidad.json")
            .then(response => response.json())
            .then(data => {
                paradas = Array.isArray(data) ? data : [data];
            })
            .catch(err => console.error("Error cargando JSON:", err));

        // Función para mostrar marcadores
        function mostrarMarcadores() {
            // Elimina marcadores previos
            markers.forEach(m => m.remove());
            markers = [];

            // Solo mostrar si el zoom es suficiente
            if (map.getZoom() >= 13) {
                paradas.forEach(p => {
                    const popupContent = `
                        <strong>${p.name}</strong><br>
                        ID: ${p.stop_id}<br>
                        Metro: ${p.es_metro ? "Sí" : "No"}<br>
                        Accesibilidad: ${p.wheelchair_boarding}<br>
                        Reportes: ${p.reportes && p.reportes.length > 0 ? p.reportes.join(", ") : "Ninguno"}
                    `;

                    const marker = new maplibregl.Marker()
                        .setLngLat([p.lon, p.lat])
                        .setPopup(new maplibregl.Popup().setHTML(popupContent))
                        .addTo(map);

                    markers.push(marker);
                });
            }
        }

        // Escuchar cambios de zoom o movimiento
        map.on("moveend", mostrarMarcadores);
        map.on("zoomend", mostrarMarcadores);
    </script>
</body>
</html>
