<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Mapa accesibilidad - starter Persona 2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #mapa { height: 100vh; width: 100%; }
  .leyenda {
    position: absolute; bottom: 20px; left: 20px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: 13px;
  }
  .leyenda span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .buscador {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 10px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); display: flex; gap: 6px;
  }
  .buscador input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; width: 180px; }
  .buscador button { padding: 6px 12px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="mapa"></div>

<div class="buscador">
  <input id="desde" placeholder="Desde (nombre paradero)" />
  <input id="hasta" placeholder="Hasta (nombre paradero)" />
  <button onclick="buscarRuta()">Buscar ruta accesible</button>
</div>

<div class="leyenda">
  <div><span style="background:#22c55e"></span>Accesible</div>
  <div><span style="background:#ef4444"></span>No accesible</div>
  <div><span style="background:#9ca3af"></span>Sin información</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
// -----------------------------------------------------------------
// CONFIG: cambia esta ruta al JSON que genera Persona 1 en Colab
// -----------------------------------------------------------------
const RUTA_JSON = "paraderos_accesibilidad.json";

// Centro aprox. Santiago
const mapa = L.map("mapa").setView([-33.45, -70.65], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 19,
}).addTo(mapa);

const clusterGroup = L.markerClusterGroup();
let paraderos = []; // se llena al cargar el JSON, queda global para el buscador

const COLORES = {
  accesible: "#22c55e",
  no_accesible: "#ef4444",
  sin_info: "#9ca3af",
};

function crearMarcador(p) {
  if (p.lat == null || p.lon == null) return null;
  const color = COLORES[p.wheelchair_boarding] || COLORES.sin_info;
  const marker = L.circleMarker([p.lat, p.lon], {
    radius: 6,
    fillColor: color,
    color: "#fff",
    weight: 1,
    fillOpacity: 0.9,
  });
  marker.bindPopup(popupHtml(p));
  marker._stopData = p; // guardamos referencia para actualizar color luego
  return marker;
}

function popupHtml(p) {
  return `
    <div style="min-width:200px">
      <strong>${p.name}</strong><br/>
      Estado: <span id="estado-${p.stop_id}">${p.wheelchair_boarding}</span><br/>
      <textarea id="txt-${p.stop_id}" placeholder="Ej: ascensor fuera de servicio"
                style="width:100%;margin-top:6px" rows="2"></textarea><br/>
      <button onclick="enviarReporte('${p.stop_id}')" style="margin-top:6px">Reportar</button>
    </div>
  `;
}

// -----------------------------------------------------------------
// Carga inicial del JSON de Persona 1
// -----------------------------------------------------------------
fetch(RUTA_JSON)
  .then((r) => r.json())
  .then((data) => {
    paraderos = data;
    data.forEach((p) => {
      const m = crearMarcador(p);
      if (m) clusterGroup.addLayer(m);
    });
    mapa.addLayer(clusterGroup);
  })
  .catch((err) => console.error("Error cargando JSON de paraderos:", err));

// -----------------------------------------------------------------
// Reportes: conecta aquí el endpoint real del backend (Persona 3)
// -----------------------------------------------------------------
function enviarReporte(stopId) {
  const texto = document.getElementById(`txt-${stopId}`).value;
  if (!texto.trim()) return;

  // TODO Persona 2/3: reemplazar por la URL real del backend
  fetch("/api/reportes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stop_id: stopId, texto }),
  })
    .then((r) => r.json())
    .then((resp) => {
      // resp.esperado = { stop_id, nueva_categoria: "no_accesible" | ... }
      actualizarColorMarcador(resp.stop_id, resp.nueva_categoria);
      document.getElementById(`estado-${stopId}`).innerText = resp.nueva_categoria;
    })
    .catch((err) => console.error("Error enviando reporte:", err));
}

function actualizarColorMarcador(stopId, nuevaCategoria) {
  clusterGroup.eachLayer((layer) => {
    if (layer._stopData && layer._stopData.stop_id === stopId) {
      layer.setStyle({ fillColor: COLORES[nuevaCategoria] || COLORES.sin_info });
      layer._stopData.wheelchair_boarding = nuevaCategoria;
    }
  });
}

// -----------------------------------------------------------------
// Buscador simple por nombre (autocomplete real se puede sumar después)
// -----------------------------------------------------------------
function buscarPorNombre(texto) {
  const t = texto.trim().toLowerCase();
  return paraderos.find((p) => p.name.toLowerCase().includes(t));
}

function buscarRuta() {
  const desde = buscarPorNombre(document.getElementById("desde").value);
  const hasta = buscarPorNombre(document.getElementById("hasta").value);

  if (!desde || !hasta) {
    alert("No se encontró alguno de los paraderos. Prueba con otro nombre.");
    return;
  }

  // TODO Persona 4: reemplazar por el algoritmo real de ruteo accesible.
  // Por ahora dibuja una línea recta como placeholder para probar el flujo visual.
  const linea = L.polyline(
    [
      [desde.lat, desde.lon],
      [hasta.lat, hasta.lon],
    ],
    { color: "#2563eb", weight: 4 }
  ).addTo(mapa);

  mapa.fitBounds(linea.getBounds(), { padding: [40, 40] });
}
</script>
</body>
</html>
